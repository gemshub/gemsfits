name: ci-build
on:
  push:
    branches:
      - deploy_actions1
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge, defaults
          channel-priority: true

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda run -n base python -m conda_devenv

      - name: Building, Testing & Installing gemsfits
        if: matrix.os != 'windows-latest'
        shell: bash -l {0}
        run: |
          conda activate gemsfits
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          ./conda-install-dependencies.sh OLD_EJDB
          mkdir .build && cd .build
          cmake -GNinja .. -DUSE_OLD_EJDB=ON -DCMAKE_BUILD_TYPE=Release
          ninja
          ninja install

      - name: Building, Testing & Installing gemsfits (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call conda activate gemsfits || goto :eof
          copy "cmake\qt.conf" "C:\Miniconda\envs\gemsfits\Library\lib\qt6\bin" || goto :eof
          cmake -DUSE_OLD_EJDB=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH="%GITHUB_WORKSPACE%\install" -A x64 -S . -B build  || goto :eof
          cmake --build build --target install  --config Release  || goto :eof

      - name: Check conda
        run: |
          conda config --show
          conda list --show-channel-urls

