name: deploy-macos-intel

on:
  push:
    branches:
      - deploy_actions
  release:
    types:
      - published

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel ]

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            submodules: recursive

      # -------------------------
      # Version extraction
      # -------------------------
      - name: Get version from CMakeLists.txt
        id: get_version
        uses: DarwinInnovation/cmake-project-version-action@v1.0

      - name: Set deploy name
        id: strings
        shell: bash
        run: echo "deploy-name=GEMFITS${{ steps.get_version.outputs.version }}-intel" >> "$GITHUB_OUTPUT"

      - name: Set deploy dir
        id: strings2
        shell: bash
        run: |
          echo "deploy-output-dir=${{ github.workspace }}/${{ steps.strings.outputs.deploy-name }}" >> "$GITHUB_OUTPUT"
          echo "deploy-output-name=macos-${{ steps.strings.outputs.deploy-name }}.zip" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Conda environment
      # -------------------------
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge, defaults
          channel-priority: true

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          # Invoke as a module in the base env explicitly - a bare `conda devenv`
          # resolves to whichever entry-point script is first on PATH, which is
          # ambiguous right after install; `conda run -n base` pins it.
          conda run -n base python -m conda_devenv

      # -------------------------
      # Build & Install
      # -------------------------
      - name: Building, Testing & Installing gemsfits
        shell: bash -l {0}
        run: |
          conda activate gemsfits
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          ./conda-install-dependencies.sh OLD_EJDB
          mkdir .build && cd .build
          cmake -GNinja .. -DUSE_OLD_EJDB=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ steps.strings2.outputs.deploy-output-dir }}
          ninja
          ninja install

      # -------------------------
      # Post-install adjustments
      # -------------------------
      - name: Check deploy
        run: |
          cd ${{ github.workspace }}
          cp -r "Resources" "${{ steps.strings2.outputs.deploy-output-dir }}/gem-fits-shell.app/Contents"
          cp "${{ steps.strings2.outputs.deploy-output-dir }}/bin/gem-fits" "${{ steps.strings2.outputs.deploy-output-dir }}/gem-fits-shell.app/Contents/MacOS/"
          cp "Resources/runshell-macos.sh" "${{ steps.strings.outputs.deploy-name }}/runshell.sh"
          cp "Resources/README-macos.txt" "${{ steps.strings.outputs.deploy-name }}/README.txt"
          otool -L "${{ steps.strings2.outputs.deploy-output-dir }}/gem-fits-shell.app/Contents/MacOS/gem-fits"

      # -------------------------
      # macdeployqt (NO DMG)
      #
      # macdeployqt only fixes up rpaths/bundles dylibs for the app's main
      # executable by default. gem-fits is a second, separately-copied
      # executable inside Contents/MacOS/ (launched by gem-fits-shell via
      # QProcess, and also runnable standalone) that links GEMS3K/ejdb/etc
      # itself, so it needs -executable= to get the same treatment - otherwise
      # it ships with no LC_RPATH at all and aborts with
      # "Library not loaded: @rpath/libGEMS3K.dylib". Run without -dmg here
      # (matching GEMSGUI's deploy-macos.yml) so the app gets ad-hoc signed
      # below before being packaged - macdeployqt -dmg alone never signs
      # anything, and signing after macdeployqt's file copies is required or
      # any pre-existing signature is invalidated anyway.
      # -------------------------
      - name: Run macdeployqt (no DMG)
        shell: bash -l {0}
        run: |
          conda activate gemsfits
          cd "${{ steps.strings2.outputs.deploy-output-dir }}"
          /Users/runner/miniconda3/envs/gemsfits/lib/qt6/bin/macdeployqt gem-fits-shell.app -executable=gem-fits-shell.app/Contents/MacOS/gem-fits -verbose=2
          # Diagnostic only - macdeployqt rewrites gem-fits's @rpath/libGEMS3K.dylib (etc)
          # references to explicit @executable_path/../Frameworks/... ones directly, so it
          # legitimately may add no LC_RPATH at all; don't gate the step's exit code on grep's
          # match/no-match result (this script has no `set -e`, so the last command's exit code
          # is otherwise the step's exit code).
          otool -L gem-fits-shell.app/Contents/MacOS/gem-fits
          otool -l gem-fits-shell.app/Contents/MacOS/gem-fits | grep -A2 LC_RPATH || true

      # -------------------------
      # Ad-hoc signing
      #
      # Without at least an ad-hoc signature, a freshly downloaded/unzipped
      # app (quarantine bit set by the browser/Finder) tends to fail with
      # "app is damaged and can't be opened" rather than the milder
      # "unidentified developer" prompt - a distinct, harder Gatekeeper
      # failure. Mirrors GEMSGUI's deploy-macos.yml fix for the same issue
      # (note: GEMSGUI's own deploy-macos-intel.yml hasn't been updated with
      # this fix yet, so the arm64 workflow is the pattern to follow here).
      # -------------------------
      - name: Ad-hoc sign .app bundle
        run: |
          cd "${{ steps.strings2.outputs.deploy-output-dir }}"
          xattr -dr com.apple.quarantine gem-fits-shell.app || true
          codesign --force --deep --sign - gem-fits-shell.app
          codesign --verify --deep --strict gem-fits-shell.app

      # -------------------------
      # Free disk space before DMG
      #
      # GitHub-hosted macOS runners (Intel and arm64 alike) only have ~14GB
      # of storage, which is tight for a Qt6 + conda + GEMS3K/ThermoFun/
      # ChemicalFun/ejdb build. The out-of-tree .build/ dir (CMake object
      # files/intermediates for gemsfits+GEMS3K+ejdb) and the conda package
      # cache are no longer needed once install + macdeployqt have run, and
      # are the largest reclaimable chunks before hdiutil needs scratch space
      # to build the DMG.
      # -------------------------
      # DMG disabled for now (Intel runner keeps hitting "No space left on
      # device" in hdiutil create) - only the zip is produced below. Re-enable
      # by uncommenting this and the "Create DMG" / DMG upload steps.
      # - name: Free disk space before DMG
      #   shell: bash -l {0}
      #   run: |
      #     conda activate gemsfits
      #     echo "--- before cleanup ---"
      #     df -h .
      #     du -sh "${{ github.workspace }}/.build" 2>/dev/null || true
      #     du -sh "$CONDA_PREFIX/pkgs" 2>/dev/null || true
      #     du -sh "${{ steps.strings2.outputs.deploy-output-dir }}" 2>/dev/null || true
      #     du -sh "${{ steps.strings2.outputs.deploy-output-dir }}/gem-fits-shell.app" 2>/dev/null || true
      #     conda clean --all -y || true
      #     rm -rf "${{ github.workspace }}/.build"
      #     echo "--- after cleanup ---"
      #     df -h .

      # -------------------------
      # Create DMG (signed app inside)
      # -------------------------
      # - name: Clean previous DMG
      #   run: |
      #     hdiutil detach /Volumes/gem-fits-shell -force || true
      #     rm -f gem-fits-shell.dmg

      # - name: Create DMG
      #   run: |
      #     cd "${{ steps.strings2.outputs.deploy-output-dir }}"
      #     hdiutil create -volname gem-fits-shell \
      #       -srcfolder gem-fits-shell.app \
      #       -ov -format UDZO -imagekey zlib-level=9 gem-fits-shell.dmg
      #     mv gem-fits-shell.dmg "${{ github.workspace }}/macos-${{ steps.strings.outputs.deploy-name }}.dmg"

      # -------------------------
      # ZIP packaging
      # -------------------------
      - name: Create zip archive for GitHub release
        run: |
          cd ${{ github.workspace }}
          zip -r ${{ steps.strings2.outputs.deploy-output-name }} ${{ steps.strings.outputs.deploy-name }}

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.strings.outputs.deploy-name }}-zip
          path: ${{ github.workspace }}/${{ steps.strings2.outputs.deploy-output-name }}

      # - name: Upload artifact DMG
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: macos-${{ steps.strings.outputs.deploy-name }}-dmg
      #     path: ${{ github.workspace }}/macos-${{ steps.strings.outputs.deploy-name }}.dmg

      # -------------------------
      # Release assets
      # -------------------------
      - name: Upload ZIP release asset
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ github.workspace }}/${{ steps.strings2.outputs.deploy-output-name }}
          asset_name: ${{ steps.strings2.outputs.deploy-output-name }}
          asset_content_type: application/zip

      # - name: Upload DMG release asset
      #   if: github.event_name == 'release' && github.event.action == 'published'
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ github.event.release.upload_url }}
      #     asset_path: ${{ github.workspace }}/macos-${{ steps.strings.outputs.deploy-name }}.dmg
      #     asset_name: macos-${{ steps.strings.outputs.deploy-name }}.dmg
      #     asset_content_type: application/x-apple-diskimage
